<!DOCTYPE html>
<html lang="ru">
<head><style>html{visibility:hidden}</style><script src="supabase-config.js"></script><script type="module" src="supabase-gate.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История изменений — Счастливый ребёнок</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="site-enhancements.css">
</head>
<body>
<header class="header"><a class="logo" href="./home.html"><div class="logo-icon"><img src="./assets/brand-logo.png" alt="Логотип Счастливый ребёнок"></div><div class="logo-text"><strong>СЧАСТЛИВЫЙ РЕБЁНОК</strong><span>ЕДИНАЯ ТЕХНИЧЕСКАЯ СИСТЕМА</span></div></a><div class="user"><span class="user-status"></span>Пользователь</div></header>
<main class="inner-page">
<div class="breadcrumb"><a href="./home.html">Главная</a><span>/</span><strong>История изменений</strong></div>
<section class="info-section">
    <div class="section-header"><h2>История изменений</h2><span id="lastUpdate"></span></div>
    <div id="changelog" class="changelog-list"></div>
</section>
</main>
<footer><span>© Счастливый ребёнок</span><span>Внутренняя информационная система</span></footer>
<script src="products.js"></script><script src="site-contacts.js"></script>
<script src="script.js"></script><script src="changelog-data.js"></script>
<script>
(function(){
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}) : 'Ранее';
    const list = Array.isArray(window.SITE_CHANGELOG) ? window.SITE_CHANGELOG : [];
    const dated = list.filter(e => e.date).map(e => e.date).sort().pop();
    document.getElementById('lastUpdate').textContent = dated ? 'Последнее обновление: ' + fmt(dated) : '';
    document.getElementById('changelog').innerHTML = list.length ? list.map(e => `
        <article class="changelog-entry">
            <div class="changelog-date">${esc(fmt(e.date))}</div>
            <div><h3>${esc(e.title)}</h3><ul>${(e.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
        </article>`).join('') : '<p class="cabinet-empty">Записей пока нет.</p>';
})();
</script>
<script src="pdf-preview.js"></script>
</body>
</html>
